<body data-page="contact" data-header="dark">
  <main id="main">
    <header class="page-head">
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html" data-i18n="nav.home"></a><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="m9 18 6-6-6-6"/></svg><span data-i18n="contact.title"></span></nav>

        <p class="lead reveal" data-i18n="contact.lead"></p>
      </div>
    </header>

    <section class="section">
      <div class="container contact-grid">
        <div class="cinfo">
          <a class="cinfo__item reveal" style="--i:0" data-wa-link target="_blank" rel="noopener">
            <span class="cinfo__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M17.47 14.38c-.3-.15-1.75-.86-2.02-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.75-1.64-2.05-.17-.3-.02-.46.13-.6.13-.14.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.03-.52-.07-.15-.67-1.61-.92-2.2-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.8.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.21 3.08c.15.2 2.1 3.2 5.08 4.49.71.31 1.26.49 1.69.63.71.22 1.36.19 1.87.12.57-.09 1.75-.72 2-1.41.25-.7.25-1.29.17-1.41-.07-.13-.27-.2-.57-.35M12.05 21.5h-.01a9.4 9.4 0 0 1-4.8-1.31l-.34-.2-3.56.93.95-3.47-.22-.36a9.4 9.4 0 0 1-1.44-5.02c0-5.2 4.24-9.43 9.44-9.43 2.52 0 4.89.98 6.67 2.77a9.37 9.37 0 0 1 2.76 6.67c0 5.2-4.24 9.43-9.44 9.43m8.03-17.46A11.27 11.27 0 0 0 12.05.72C5.8.72.7 5.8.7 12.07c0 2 .52 3.95 1.52 5.67L.6 23.62l6.02-1.58a11.3 11.3 0 0 0 5.42 1.38h.01c6.26 0 11.35-5.09 11.35-11.35 0-3.03-1.18-5.88-3.33-8.03"/></svg></span>
            <div><small data-i18n="contact.whatsapp"></small><b>+595 983 836 674</b></div>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
          </a>
          <a class="cinfo__item reveal" style="--i:1" href="https://www.instagram.com/ug_collection27/" target="_blank" rel="noopener">
            <span class="cinfo__icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2.5" y="2.5" width="19" height="19" rx="5.5"/><circle cx="12" cy="12" r="4.2"/><circle cx="17.6" cy="6.4" r=".9" fill="currentColor" stroke="none"/></svg></span>
            <div><small data-i18n="contact.instagram"></small><b>@ug_collection27</b></div>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M7 17 17 7"/><path d="M8 7h9v9"/></svg>
          </a>
        </div>

        <form class="form reveal" novalidate data-form>
          <h2 class="h-2" data-i18n="contact.formTitle"></h2>
          <div class="field">
            <label for="cf-name"><span data-i18n="contact.name"></span> *</label>
            <input id="cf-name" name="name" autocomplete="name" required>
            <span class="field__err" role="alert"></span>
          </div>
          <div class="field">
            <label for="cf-model" data-i18n="contact.model"></label>
            <select id="cf-model" name="model"></select>
          </div>
          <div class="field">
            <label for="cf-msg"><span data-i18n="contact.message"></span> *</label>
            <textarea id="cf-msg" name="message" required></textarea>
            <span class="field__err" role="alert"></span>
          </div>
          <button class="btn btn--wa btn--block" type="submit"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12.05 21.5h-.01a9.4 9.4 0 0 1-4.8-1.31l-.34-.2-3.56.93.95-3.47-.22-.36a9.4 9.4 0 0 1-1.44-5.02c0-5.2 4.24-9.43 9.44-9.43 2.52 0 4.89.98 6.67 2.77a9.37 9.37 0 0 1 2.76 6.67c0 5.2-4.24 9.43-9.44 9.43m8.03-17.46A11.27 11.27 0 0 0 12.05.72C5.8.72.7 5.8.7 12.07c0 2 .52 3.95 1.52 5.67L.6 23.62l6.02-1.58a11.3 11.3 0 0 0 5.42 1.38h.01c6.26 0 11.35-5.09 11.35-11.35 0-3.03-1.18-5.88-3.33-8.03"/></svg><span data-i18n="contact.send"></span></button>
        </form>
      </div>
    </section>
  </main>

  <script src="assets/js/core.js"></script>
  <script>
    (async () => {
      const { $, t, esc, productName, waLink } = UG;
      const DATA = await UG.ready;
      $('[data-wa-link]').href = waLink();
      const sel = $('#cf-model');
      const fill = () => {
        const cur = sel.value;
        sel.innerHTML = `<option value="">${esc(t('contact.anyModel'))}</option>` + DATA.products.map((p) => `<option value="${esc(p.brand + ' ' + productName(p))}">${esc(productName(p))}</option>`).join('');
        sel.value = cur;
      };
      fill();
      const pre = new URLSearchParams(location.search).get('m');
      if (pre) sel.value = pre;
      document.addEventListener('ug:lang', fill);
      const form = $('[data-form]');
      const check = (el) => {
        const ok = el.value.trim().length > 0;
        el.closest('.field').classList.toggle('has-error', !ok);
        el.closest('.field').querySelector('.field__err').textContent = ok ? '' : t('contact.required');
        return ok;
      };
      form.addEventListener('focusout', (e) => { if (e.target.required && e.target.closest('.field').classList.contains('has-error')) check(e.target); });
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const req = [...form.querySelectorAll('[required]')];
        const bad = req.filter((el) => !check(el));
        if (bad.length) { bad[0].focus(); return; }
        const f = new FormData(form);
        let msg = t('contact.waMsg', { name: f.get('name').trim() });
        if (f.get('model')) msg += ' ' + t('contact.waModel', { model: f.get('model') });
        msg += '\n\n' + f.get('message').trim();
        window.open(waLink(msg), '_blank', 'noopener');
      });
    })();
  </script>
</body>
</html>
