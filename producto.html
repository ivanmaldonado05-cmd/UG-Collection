<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reloj — UG Collection</title>
  <meta name="description" content="Relojes Pagani Design en Paraguay. Consultá por WhatsApp.">
  <meta name="theme-color" content="#f6f3ee">
  <link rel="icon" href="assets/img/favicon.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="product">
  <main id="main" class="pdp">
    <div class="container" data-pdp>
      <div class="pdp__grid">
        <div class="skel" style="aspect-ratio:1"></div>
        <div style="display:grid;gap:16px;align-content:start"><div class="skel" style="height:40px;width:40%"></div><div class="skel" style="height:70px"></div><div class="skel" style="height:30px;width:50%"></div><div class="skel" style="height:200px"></div></div>
      </div>
    </div>

    <section class="section" data-related-wrap hidden>
      <div class="container">
        <div class="section-head">
          <h2 class="h-2" data-i18n="product.related"></h2>
          <div class="carousel__nav">
            <button class="round-btn" data-prev data-i18n-attr="aria-label:common.prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
            <button class="round-btn" data-next data-i18n-attr="aria-label:common.next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
          </div>
        </div>
        <div class="carousel carousel--bleed" data-carousel-related><div class="carousel__track" data-related></div><div class="carousel__bar"><i></i></div></div>
      </div>
    </section>

    <section class="section section--paper" data-recent-wrap hidden style="padding-top:clamp(56px,7vw,96px)">
      <div class="container">
        <div class="section-head">
          <h2 class="h-2" data-i18n="product.recent"></h2>
          <div class="carousel__nav">
            <button class="round-btn" data-prev data-i18n-attr="aria-label:common.prev"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg></button>
            <button class="round-btn" data-next data-i18n-attr="aria-label:common.next"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
          </div>
        </div>
        <div class="carousel carousel--bleed" data-carousel-recent><div class="carousel__track" data-recent></div><div class="carousel__bar"><i></i></div></div>
      </div>
    </section>
  </main>

  <div class="sticky-cta" data-sticky aria-hidden="true"></div>

  <script src="assets/js/core.js"></script>
  <script src="assets/js/product.js"></script>
</body>
</html>
